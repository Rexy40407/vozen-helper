# Rotação de logs do painel Vozen Helper (RGPD — retenção de 30 dias).
#
# O painel (API + túnel) escreve para ~/panel/api.log e ~/panel/tunnel.log. Estes logs
# contêm dados pessoais (id do dono nas linhas de auditoria; IPs no log do túnel), por
# isso limitam-se a 30 dias. Ver docs/GDPR-INVENTARIO.md.
#
# Instalação no VPS (uma vez):
#   sudo cp deploy/vozen-panel-logrotate.conf /etc/logrotate.d/vozen-panel
#   sudo chown root:root /etc/logrotate.d/vozen-panel
#   sudo chmod 644 /etc/logrotate.d/vozen-panel
#   sudo logrotate --debug /etc/logrotate.d/vozen-panel   # testar (não roda nada)
#
# Ajusta os caminhos se o painel não estiver em /home/vozen/panel.

/home/vozen/panel/api.log /home/vozen/panel/tunnel.log {
    daily
    rotate 30
    maxage 30
    missingok
    notifempty
    compress
    delaycompress
    # O processo do painel mantém o ficheiro aberto (redireção do supervisor); copytruncate
    # copia e trunca em vez de renomear, para não perder o handle nem exigir reinício.
    copytruncate
}
